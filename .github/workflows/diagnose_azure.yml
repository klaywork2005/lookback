name: Diagnose Azure app

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_176AB235CF974296A5481D3A1FE4A7A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DEF49D1D94B346EE8F7C6E3A13454FA2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7561C1C03FB4429C9EEB0B810BE28993 }}

      - name: Inspect app and quotas
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{state:state}' -o json
          app_id=$(az webapp list --query "[?name=='lookback-web'].id | [0]" -o tsv)
          if [[ -z "$app_id" ]]; then
            echo "App was not found in the current subscription."
            exit 1
          fi
          az webapp show --ids "$app_id" --query '{state:state,enabled:enabled,availabilityState:availabilityState,usageState:usageState,defaultHostName:defaultHostName}' -o json
          plan_id=$(az webapp show --ids "$app_id" --query serverFarmId -o tsv)
          az appservice plan show --ids "$plan_id" --query '{status:status,sku:sku}' -o json || echo "Hosting plan details are unavailable to this identity."
          az rest --method get --url "https://management.azure.com${app_id}/usages?api-version=2024-11-01" --query 'value[].{name:name.localizedValue,currentValue:currentValue,limit:limit,unit:unit,nextResetTime:nextResetTime}' -o json
          az monitor activity-log list --resource-id "$app_id" --offset 7d --max-events 30 --query '[].{time:eventTimestamp,operation:operationName.localizedValue,status:status.localizedValue,subStatus:subStatus.localizedValue}' -o json || echo "Activity log is unavailable to this identity."

      - name: Inspect quota diagnostics
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(az webapp list --query "[?name=='lookback-web'].id | [0]" -o tsv)
          az webapp show --ids "$app_id" --query '{state:state,sku:sku,kind:kind}' -o json
          az webapp config show --ids "$app_id" --query '{linuxFxVersion:linuxFxVersion,alwaysOn:alwaysOn,limits:limits,numberOfWorkers:numberOfWorkers}' -o json
          az monitor metrics list --resource "$app_id" --metric CpuTime --interval PT1H --aggregation Total --offset 24h --query 'value[].{name:name.localizedValue,timeseries:timeseries[].data}' -o json || echo "CPU metrics are unavailable."
          az rest --method get --url "https://management.azure.com${app_id}/detectors/LinuxAppDown?api-version=2024-11-01" --query 'properties.dataset[].table' -o json || echo "Availability diagnostics are unavailable."

      - name: Recover app and verify health
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(az webapp list --query "[?name=='lookback-web'].id | [0]" -o tsv)
          state=$(az webapp show --ids "$app_id" --query state -o tsv)
          if [[ "$state" == "Stopped" ]]; then
            az webapp start --ids "$app_id"
          elif [[ "$state" == "QuotaExceeded" ]]; then
            az webapp restart --ids "$app_id"
          else
            echo "App state: $state"
          fi
          az webapp show --ids "$app_id" --query '{state:state,enabled:enabled,usageState:usageState}' -o json
          hostname=$(az webapp show --ids "$app_id" --query defaultHostName -o tsv)
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 15 --max-time 30 "https://${hostname}/api/health/"
