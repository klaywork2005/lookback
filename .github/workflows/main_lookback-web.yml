name: Build and deploy Lookback

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: templates/package-lock.json

      - name: Build frontend
        working-directory: templates
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !templates/node_modules/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_176AB235CF974296A5481D3A1FE4A7A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DEF49D1D94B346EE8F7C6E3A13454FA2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7561C1C03FB4429C9EEB0B810BE28993 }}

      - name: Deploy application
        uses: azure/webapps-deploy@v3
        with:
          app-name: lookback-web
          slot-name: Production
